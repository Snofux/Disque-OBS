
name: Compilation Disque OBS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer CMake
        uses: lukka/get-cmake@latest

      - name: Verifier les fichiers
        shell: pwsh
        run: |
          Get-ChildItem -Recurse
          cmake --version

      - name: Verifier les outils Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "Visual Studio Installer introuvable"
          }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw "Compilateur Visual C++ introuvable"
          }
          Write-Host "Visual Studio trouve : $vs"
