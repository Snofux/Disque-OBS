
name: Compilation Disque OBS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Recuperer notre projet
        uses: actions/checkout@v4

      - name: Installer CMake
        uses: lukka/get-cmake@latest

      - name: Preparer le modele officiel OBS
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/obsproject/obs-plugintemplate.git _obs_template

          if ($LASTEXITCODE -ne 0) {
            throw "Impossible de recuperer le modele OBS"
          }

          Copy-Item disque.c _obs_template/src/plugin-main.c -Force

          $specPath = "_obs_template/buildspec.json"
          $spec = Get-Content $specPath -Raw | ConvertFrom-Json

          $spec.name = "disque-obs"
          $spec.displayName = "Disque OBS"
          $spec.version = "0.8.0"
          $spec.author = "Snofux"
          $spec.website = "https://github.com/Snofux/Disque-OBS"

          $spec | ConvertTo-Json -Depth 20 |
            Set-Content -Path $specPath -Encoding utf8

      - name: Configurer la compilation Windows
        shell: pwsh
        working-directory: _obs_template
        run: |
          cmake --preset windows-x64

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Compiler Disque OBS
        shell: pwsh
        working-directory: _obs_template
        run: |
          cmake --build --preset windows-x64 --config Release --parallel

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Recuperer la DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path _obs_template/build_x64 -Filter "disque-obs.dll" -Recurse |
            Select-Object -First 1

          if (-not $dll) {
            throw "La DLL disque-obs.dll est introuvable"
          }

          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $dll.FullName artifact/disque-obs.dll

      - name: Calculer SHA256
        shell: pwsh
        run: |
          $hash = Get-FileHash "artifact/disque-obs.dll" -Algorithm SHA256
          Write-Host "SHA256 de disque-obs.dll :"
          Write-Host $hash.Hash
          "$($hash.Hash)  disque-obs.dll" |
            Set-Content "artifact/SHA256.txt"

      - name: Analyser avec Microsoft Defender
        shell: pwsh
        run: |
          $defender = Get-MpComputerStatus -ErrorAction Stop
          Write-Host "Antivirus actif : $($defender.AntivirusEnabled)"

          if (-not $defender.AntivirusEnabled) {
            throw "Microsoft Defender Antivirus n'est pas actif"
          }

          $file = (Resolve-Path "artifact/disque-obs.dll").Path
          Start-MpScan -ScanType CustomScan -ScanPath $file -ErrorAction Stop

          $threats = @(Get-MpThreatDetection -ErrorAction Stop |
            Where-Object {
              $_.Resources -match "disque-obs.dll"
            })

          if ($threats.Count -gt 0) {
            throw "Microsoft Defender a detecte une menace concernant la DLL"
          }

          Write-Host "Analyse terminee sans detection signalee"

      - name: Publier le resultat
        uses: actions/upload-artifact@v4
        with:
          name: disque-obs-windows-x64
          path: artifact/
